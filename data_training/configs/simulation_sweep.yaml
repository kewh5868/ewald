schema_version: "1"
sweep_id: fibril_texture_seed_sweep_v0
structures: all
ewald_hooks:
  simulator: ewald.simulation.giwaxs:simulate_giwaxs_image
  peak_table_exporter: ewald.simulation.giwaxs:calculate_giwaxs_peak_rows
base_parameters:
  sigma_theta: 0.035
  sigma_phi: 0.25
  sigma_r: 0.035
  q_dependent_sigma_r: 0.25
  q_dependent_sigma_z: 0.15
  hkl_extent: 14
  theta_x_deg: 90.0
  theta_y_deg: 0.0
  qxy_min: -2.8
  qxy_max: 2.8
  qz_min: 0.0
  qz_max: 2.8
  resolution_x: 512
  resolution_z: 384
  wavelength_angstrom: 1.0
  incident_angle_deg: 0.2
  tilt_angle_deg: 0.0
  solid_angle_correction: true
  missing_wedge_correction: true
base_texture:
  model: fiber_texture
  preferred_axis: "001"
  orientation_family: fiber_axis_in_plane
  mosaicity_deg: 6.0
artifact_profiles:
  - clean
  - detector_realistic
  - harsh_detector
repetitions: 2
split_policy:
  train: 0.8
  validation: 0.1
  test: 0.1
axes:
  - name: incident_orientation_theta_x
    target: parameters.theta_x_deg
    values: [78.0, 84.0, 90.0, 96.0]
  - name: azimuthal_orientation_theta_y
    target: parameters.theta_y_deg
    values: [0.0, 20.0, 45.0, 70.0]
  - name: radial_broadening
    target: parameters.sigma_r
    values: [0.025, 0.04, 0.07]
  - name: azimuthal_broadening
    target: parameters.sigma_phi
    values: [0.12, 0.25, 0.5]
  - name: texture_axis
    target: texture.preferred_axis
    values: ["001", "010"]
  - name: mosaicity
    target: texture.mosaicity_deg
    values: [2.0, 8.0, 18.0]
metadata:
  intent: >
    First-pass fibril-texture sweep biased toward 2-3 inverse angstrom detector
    windows. The goal is to train peak detection, peak grouping, indexing, and
    ranked structure guessing stages to work with realistic limited-q GIWAXS
    information before adding optional high-q shards.
