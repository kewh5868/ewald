name: ewald-py312
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Packaging and local development
  - setuptools
  - setuptools-git-versioning
  - wheel
  - pre-commit
  - pytest
  - pytest-cov
  - pytest-qt
  - coverage
  - black
  - flake8
  - isort
  - codespell
  - nbstripout

  # Numerical, lazy-array, and project data backends
  - numpy
  - scipy
  - pandas
  - xarray
  - dask
  - distributed
  - zarr
  - netcdf4
  - h5py
  - bottleneck
  - numexpr

  # Detector-image I/O used by tests and early loaders
  - tifffile
  - imageio
  - pyyaml

  # Plotting, fitting, and image-analysis basics
  - matplotlib
  - lmfit
  - scikit-image

  # Interactive analysis notebooks
  - ipykernel
  - ipython

  # Qt6, X-ray scattering, crystallography, and scaffold helpers
  - pip:
      - build
      - PySide6>=6.8
      - qtpy>=2.4
      - QtAwesome>=1.3
      - pyqtgraph>=0.13
      - fabio>=2024.9
      - pyFAI>=2025.1
      - pymatgen>=2025.1
      - spglib>=2.5
      - PyCifRW>=5.0
      - ase>=3.23
      - opencv-python-headless>=4.10
      - dask-image>=2024.5
      - hdf5plugin>=5.0
      - scikit-package
