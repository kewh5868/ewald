site_name: EWALD Documentation
site_description: Qt6 GIWAXS/WAXS analysis workbench for calibrated q-space analysis, lattice refinement, CIF generation, and simulation
site_url: https://kewh5868.github.io/ewald/
repo_url: https://github.com/kewh5868/ewald
repo_name: kewh5868/ewald

